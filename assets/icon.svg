<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="poleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" stroke="#2B77E6" stroke-width="8"/>

  <!-- Main pole/measurement stick -->
  <rect x="240" y="120" width="32" height="200" rx="4" fill="url(#poleGradient)" stroke="#6B21A8" stroke-width="2"/>

  <!-- Measurement marks on pole -->
  <line x1="220" y1="140" x2="272" y2="140" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="220" y1="170" x2="272" y2="170" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="220" y1="200" x2="272" y2="200" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="220" y1="230" x2="272" y2="230" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="220" y1="260" x2="272" y2="260" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="220" y1="290" x2="272" y2="290" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Top measurement indicator -->
  <polygon points="256,100 240,120 272,120" fill="#FFFFFF" stroke="#6B21A8" stroke-width="2"/>

  <!-- Ground/base line -->
  <line x1="200" y1="320" x2="312" y2="320" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- Measurement angle indicators -->
  <path d="M 200 320 Q 256 280 312 320" stroke="#FFD700" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Center measurement point -->
  <circle cx="256" cy="320" r="8" fill="#FFD700" stroke="#FFFFFF" stroke-width="2"/>

  <!-- App name hint -->
  <text x="256" y="380" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="bold">PoleCheck</text>
</svg>
